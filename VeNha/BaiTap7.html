<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 7 - Bố cục Layout Web</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            padding: 60px 40px;
            display: flex;
            justify-content: center;
        }


        /* Khung wrapper có hiệu ứng đổ bóng mờ góc dưới-trái */
        #wrapper {
            position: relative;
            width: 360px;
            border: 2px solid #000;
            padding: 8px;
            box-shadow: -16px 16px 20px rgba(0, 0, 0, 0.4); /* Đổ bóng đen bên trái-dưới đúng mẫu */
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 30px;
        }


        /* Hiển thị dòng chữ "wrapper" ở góc trên bên trái khung */
        #wrapper::before {
            content: "wrapper";
            position: absolute;
            top: -34px;
            left: 0;
            font-size: 22px;
            color: #000;
        }


        /* Khung Header */
        header {
            width: 100%;
            height: 60px;
            border: 2px solid #000;
            padding: 6px;
            font-size: 20px;
            color: #000;
        }


        /* Khung Nav bên trái */
        nav {
            width: 85px;
            height: 270px;
            border: 2px solid #000;
            padding: 6px;
            font-size: 20px;
            color: #000;
        }


        /* Khung Main bên phải */
        main {
            flex: 1;
            height: 270px;
            border: 2px solid #000;
            padding: 6px;
            font-size: 20px;
            color: #000;
        }


        /* Khung Footer ở dưới cùng */
        footer {
            width: 100%;
            height: 50px;
            border: 2px solid #000;
            padding: 6px;
            font-size: 20px;
            color: #000;
        }
    </style>
</head>
<body>


    <div id="wrapper">
        <header>header</header>
        <nav>nav</nav>
        <main>main</main>
        <footer>footer</footer>
    </div>


</body>
</html>
