<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Khoa CNTTKD - Bài 5</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            margin: 0;
            padding: 50px 20px;
        }


       
        .best-shared {
            text-align: center;
            max-width: 700px;
            margin: 0 auto;
        }


        .best-shared .logo img {
            width: 220px;
            margin-bottom: 20px;
        }


        .best-shared h2 {
            font-size: 38px;
            color: #2b2b2b;
            margin: 20px 0 15px 0;
            font-weight: normal;
        }


       
        .best-shared h2 strong {
            color: #00aeef;
            font-weight: bold;
        }


       
        .best-shared .lead-text {
            color: #333333;
            font-size: 15px;
            font-style: italic;
            line-height: 1.5;
            margin-bottom: 35px;
        }


        .btn-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }




        .btn-list li {
            display: inline-block;
            margin: 0 8px;
        }


       
        .btn-list li a {
            display: inline-block;        
            text-decoration: none;      
            background-color: #333333;  
            color: #ffffff;
            padding: 12px 28px;
            border-radius: 5px;
            font-size: 14px;
        }


        .btn-list li a:hover {
            background-color: #1a1a1a;
        }
    </style>
</head>
<body>


    <section class="best-shared">
        <p class="logo"><img src="https://ueh.edu.vn/schools/college/images/logo/bit-header-logo.png" alt="Logo BIT"></p>
        <h2>Best <strong>Shared Hosting</strong> Company</h2>
        <p class="lead-text">With this responsive landing page template, you can promote your all hosting, domain and email services.</p>
        <ul class="btn-list">
            <li><a href="./">View Plans</a></li>
            <li><a href="./">All Features</a></li>
        </ul>
    </section>


</body>
</html>
