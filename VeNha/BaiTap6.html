<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Học web chuẩn - Bài 6</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            padding: 30px 20px;
        }


        .portfolio {
            max-width: 980px;
            margin: 0 auto;
        }


        /* Khung màu xám nhạt bao quanh phần Tiêu đề và Menu Tab */
        .portfolio-header {
            background-color: #f7f7f7;
            padding: 35px 20px 25px 20px;
            text-align: center;
            margin-bottom: 25px;
        }


        /* Tiêu đề MY PORTFOLIO */
        .portfolio-header h2 {
            font-size: 24px;
            font-weight: bold;
            color: #222222;
            letter-spacing: 1px;
            display: inline-block;
        }


        /* Vạch gạch ngang nhỏ màu xanh bên dưới tiêu đề */
        .portfolio-header h2::after {
            content: "";
            display: block;
            width: 35px;
            height: 3px;
            background-color: #389b8e;
            margin: 10px auto 0 auto;
        }


        /* Danh sách các tab menu */
        .list-tab {
            list-style: none;
            padding: 0;
            margin-top: 25px;
            text-align: center;
        }


        .list-tab li {
            display: inline-block;
            margin: 0 12px;
        }


        .list-tab li a {
            text-decoration: none;
            color: #555555;
            font-weight: bold;
            font-size: 13px;
        }


        .list-tab li:first-child a,
        .list-tab li a:hover {
            color: #389b8e;
        }


        /* Danh sách ảnh dạng 3 cột */
        .galerry {
            list-style: none;
            padding: 0;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
        }


        .galerry li {
            width: calc(33.333% - 13.333px);
        }


        .galerry li a {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 220px;
            background-color: #9bc362; /* Màu xanh lá mạ chuẩn theo hình đề */
            color: #ffffff;
            font-size: 22px;
            font-family: sans-serif;
            text-decoration: none;
            position: relative;
            overflow: hidden;
        }


        .galerry li img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
        }
    </style>
</head>
